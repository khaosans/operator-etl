[project]
name = "operator-etl"
version = "0.4.0"
description = "Agentic ETL for FOIA and public comments — medallion warehouse + LangGraph + MCP"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
keywords = ["etl", "foia", "langgraph", "mcp", "medallion", "pii", "data-quality"]
dependencies = [
    "cryptography>=44.0.0",
    "duckdb>=1.2.0",
    "httpx>=0.28.0",
    "langgraph>=0.4.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "mcp>=1.6.0",
    "pandas>=2.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dateutil>=2.9.0",
    "pyyaml>=6.0.2",
    "streamlit>=1.41.0",
    "typer>=0.15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "reportlab>=4.2.0"]
llm = ["langchain-openai>=0.3.0"]
presidio = ["presidio-analyzer>=2.2.0", "presidio-anonymizer>=2.2.0"]
gcp = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "google-cloud-bigquery>=3.27.0",
    "google-cloud-storage>=2.19.0",
    "google-cloud-pubsub>=2.27.0",
    "google-cloud-secret-manager>=2.21.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",
]

[project.scripts]
etl = "operator_etl.cli:app"
etl-graph = "operator_etl_graph.cli:app"
operator-etl-mcp = "operator_etl_mcp.server:main"
operator-etl-gcp = "operator_etl_gcp.http.app:main"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
