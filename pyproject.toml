[project]
name = "operator-etl"
version = "0.2.0"
description = "Agentic ETL for FOIA and public comments — medallion warehouse + LangGraph + MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44.0.0",
    "duckdb>=1.2.0",
    "httpx>=0.28.0",
    "langgraph>=0.4.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "mcp>=1.6.0",
    "pandas>=2.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dateutil>=2.9.0",
    "pyyaml>=6.0.2",
    "streamlit>=1.41.0",
    "typer>=0.15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]
llm = ["langchain-openai>=0.3.0"]
presidio = ["presidio-analyzer>=2.2.0", "presidio-anonymizer>=2.2.0"]

[project.scripts]
etl = "operator_etl.cli:app"
etl-graph = "operator_etl_graph.cli:app"
operator-etl-mcp = "operator_etl_mcp.server:main"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
