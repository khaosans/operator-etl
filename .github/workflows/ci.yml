name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      - name: Run proof gate
        run: ./harness/e2e.sh

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cloud_extra: [gcp, aws, azure]
    steps:
      - uses: actions/checkout@v4

      - name: Build container image (${{ matrix.cloud_extra }})
        run: docker build --build-arg CLOUD_EXTRA=${{ matrix.cloud_extra }} -t operator-etl:${{ matrix.cloud_extra }} .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: operator-etl:${{ matrix.cloud_extra }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [gcp, aws, azure]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/${{ matrix.stack }}

      - name: Terraform init (no backend)
        working-directory: infra/${{ matrix.stack }}
        run: |
          for attempt in 1 2 3; do
            terraform init -backend=false -input=false && exit 0
            echo "terraform init failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 8))
          done
          exit 1

      - name: Terraform validate
        working-directory: infra/${{ matrix.stack }}
        run: terraform validate

      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/${{ matrix.stack }}
          framework: terraform
          soft_fail: true
          config_file: .checkov.yml
          output_format: cli
          quiet: true

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit==1.8.3

      - name: Run bandit SAST
        run: bandit -r src/ -c .bandit.yml -f json -o bandit-report.json

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      - name: Install pip-audit
        run: uv pip install pip-audit==2.7.3

      - name: Run pip-audit
        run: uv run pip-audit --desc --format json --output pip-audit-report.json

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          if-no-files-found: ignore

  # Single required check for rulesets / PR merge UI.
  # Matrices stay parallel; this job only aggregates outcomes.
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - e2e
      - docker
      - terraform
      - gitleaks
      - bandit
      - pip-audit
    steps:
      - name: Require all CI peers to succeed
        run: |
          set -euo pipefail
          results=(
            "e2e=${{ needs.e2e.result }}"
            "docker=${{ needs.docker.result }}"
            "terraform=${{ needs.terraform.result }}"
            "gitleaks=${{ needs.gitleaks.result }}"
            "bandit=${{ needs.bandit.result }}"
            "pip-audit=${{ needs.pip-audit.result }}"
          )
          echo "Peer job results:"
          printf '  %s\n' "${results[@]}"
          failed=0
          for entry in "${results[@]}"; do
            name="${entry%%=*}"
            result="${entry#*=}"
            if [[ "$result" != "success" ]]; then
              echo "::error::Required job '$name' did not succeed (result=$result)"
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi
          echo "ci-gate: all required peers succeeded"
