name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      - name: Run proof gate
        run: ./harness/e2e.sh

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cloud_extra: [gcp, aws, azure]
    steps:
      - uses: actions/checkout@v4

      - name: Build container image (${{ matrix.cloud_extra }})
        run: docker build --build-arg CLOUD_EXTRA=${{ matrix.cloud_extra }} -t operator-etl:${{ matrix.cloud_extra }} .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: operator-etl:${{ matrix.cloud_extra }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [gcp, aws, azure]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/${{ matrix.stack }}

      - name: Terraform init (no backend)
        working-directory: infra/${{ matrix.stack }}
        run: |
          for attempt in 1 2 3; do
            terraform init -backend=false -input=false && exit 0
            echo "terraform init failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 8))
          done
          exit 1

      - name: Terraform validate
        working-directory: infra/${{ matrix.stack }}
        run: terraform validate

      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/${{ matrix.stack }}
          framework: terraform
          soft_fail: true
          config_file: .checkov.yml
          output_format: cli
          quiet: true
