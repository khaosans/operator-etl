name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      - name: Run proof gate
        run: ./harness/e2e.sh

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cloud_extra: [gcp, aws, azure]
    steps:
      - uses: actions/checkout@v4

      - name: Build container image (${{ matrix.cloud_extra }})
        run: docker build --build-arg CLOUD_EXTRA=${{ matrix.cloud_extra }} -t operator-etl:${{ matrix.cloud_extra }} .

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [gcp, aws, azure]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/${{ matrix.stack }}

      - name: Terraform init (no backend)
        working-directory: infra/${{ matrix.stack }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infra/${{ matrix.stack }}
        run: terraform validate
