# Operator ETL — gitleaks config
# Extends defaults. Env *.example files are templates only; assigned secret
# values are forbidden by tests/test_infra_examples.py.

title = "operator-etl"

[extend]
useDefault = true

[allowlist]
description = "Infra env templates (comment-only secrets; see tests/test_infra_examples.py). SPIFFE test PEM was removed; path allowlisted so PR history stays gitleaks-clean (keys are generated at test time)."
paths = [
  '''(^|/)infra/env\.example$''',
  '''(^|/)infra/env\.[a-z]+\.example$''',
  '''(^|/)tests/fixtures/spiffe/''',
]
